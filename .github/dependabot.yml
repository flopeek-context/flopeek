version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Phase 0: disable routine version-update PRs while preserving security updates.
    open-pull-requests-limit: 0
    labels:
      - dependencies
      - ci
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # Phase 0: disable routine version-update PRs while preserving security updates.
    open-pull-requests-limit: 0
    labels:
      - dependencies
      - rust
